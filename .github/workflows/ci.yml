name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel earlier runs on the same branch/PR — only the latest matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint • Build • Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 20, 22 & 24 are LTS lines; 26 is the current release, tested for
        # forward compatibility. engines requires Node >=20.
        node: [20, 22, 24, 26]

    steps:
      - uses: actions/checkout@v4

      # No `version:` — the packageManager field in package.json is the authority.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Build first: the examples resolve @anil-labs/validator through its
      # built dist types, so the type-aware lint, typecheck, and tests all
      # need the package compiled.
      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Validates package.json exports/types resolution (publint) and
      # TypeScript resolution across module systems (arethetypeswrong).
      - name: Package checks (publint + arethetypeswrong)
        run: pnpm --filter @anil-labs/validator run check:exports

      # Smoke-test that the built package loads in plain Node — both require()
      # and import() — and that the IIFE CDN bundle was emitted.
      - name: Node import smoke test
        run: |
          node -e "require('./packages/validator/dist/index.cjs')"
          node --input-type=module -e "import('./packages/validator/dist/index.js').then(() => {})"
          test -f packages/validator/dist/index.global.js

      - name: Build examples
        run: pnpm build:examples
