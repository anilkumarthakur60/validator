name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (type-aware ESLint)
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (library + tests)
        run: npm run typecheck

      - name: Typecheck (demo)
        run: npm run demo:typecheck

      - name: Run tests
        run: npm test

      - name: Build library workspace
        run: npm run build

      - name: Build demo
        run: npm run demo:build
